<!DOCTYPE html>
<html lang="ja" xmlns="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<title>B画面</title>
		<link rel="stylesheet" th:href="@{/style.css}">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
	</head>
	<body>
		<div th:replace="~{layout/base :: header}"></div>
		<main class="content" id="content-b">
<!-- ~~~~~~~~~~~~~~~~~~~~~~入力項目のコード入力項目のコード~~~~~~~~~~~~~~~~~~~~~~-->
			<div class="input-output">
				<div class="input-zone">
					<h2>入力項目</h2>
					<div>
						<input type="text" placeholder="テキストボックス" id="text-input">
						<button id="text-button">登録</button>
					</div>
					<div>
						<textarea placeholder="テキストエリア" id="textarea-input" rows="10"></textarea>
						<button id="textarea-button">登録</button>	
					</div>
					<div>
						<label>
							はい<input type="radio" name="radio-input" value="はい">
						</label> 
						<label>
							いいえ<input type="radio" name="radio-input" value="いいえ">					
						</label>
						<button id="radio-button">登録</button>
					</div>
					<div>
						<label>
							りんご<input type="checkbox" name="fruits" value="りんご">
						</label>
						<label>
							バナナ<input type="checkbox" name="fruits" value="バナナ">					
						</label>
						<button id="checkbox-button">登録</button>
					</div>
					<select id="selectbox-input">
						<option value="すき焼き">すき焼き</option>
						<option value="親子丼">親子丼</option>
						<option value="トンカツ">トンカツ</option>
					</select>
					<button id="selectbox-button">登録</button>
				</div>
	<!-- ~~~~~~~~~~~~~~~~~~~~~~出力項目のコード出力項目のコード~~~~~~~~~~~~~~~~~~~~~~-->
				<div id="output-zone">
					<h2>出力項目</h2>
					<p>テキストボックス：<span id="text-output">未入力</span></p>
					<p>テキストエリア：<span id="textarea-output">未入力</span></p>
					<p>はい or いいえ:<span id="radio-output">未選択</span></p>
					<p>りんごとバナナ:<span id="checkbox-output">未選択</span></p>
					<p>選択された値: <span id="selectbox-output">未選択</span></p>
				</div>
			</div>
			<div th:each="i : ${#numbers.sequence(1, 30)}">
				ヘッダーが上部に固定されていることの確認<span th:text="${i}"></span>
			</div>
		</main>
		<div th:replace="~{layout/base :: footer}"></div>
		<script th:src="@{/js/screen-b.js}"></script>
	</body>
</html>
