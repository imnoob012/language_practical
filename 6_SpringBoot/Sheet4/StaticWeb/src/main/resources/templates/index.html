<!DOCTYPE html>
<html lang="ja" xmlns="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<title>A画面</title>
		<link rel="stylesheet" th:href="@{/style.css}">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
	</head>
	<body>
		<div th:replace="~{layout/base :: header}"></div>
		
		<main class="content">
			<div class="card-container">
				<div class="card">
					<a href="/register">
						<div class="card-image"><img th:src="@{/images/B画面.jpeg}" alt="B画面のイメージ画像"></img></div>
						<p class="card-content">B画面へ</p>
					</a>
				</div>
				<div class="card">
					<a href="/table">
						<div class="card-image"><img th:src="@{/images/C画面.png}" alt="C画面のイメージ画像"></img></div>
						<p class="card-content">C画面へ</p>
					</a>
				</div>
			</div>
			<p>ヘッダーが常に上部に固定されていることの確認です。</p>
			<div th:each="i : ${#numbers.sequence(1, 30)}">
				ヘッダーが上部に固定されていることの確認 No. <span th:text="${i}"></span>
			</div>
		</main>
		
		<div th:replace="~{layout/base :: footer}"></div>
	</body>
</html>
